# ShellX Cut CI
#
# Runs on every push and pull request: a brand-new runner clones ONLY what is
# in the repository and must be able to type-check, lint, test, and audit it.
# Green here is the public promise that a stranger's clean machine can build
# this code — nothing in the suite depends on maintainer machines, receipts,
# or rigs. Installer packaging is exercised separately by release.yml;
# official signed installers are always built and verified locally by the
# maintainer (see docs/public/BUILDING.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-and-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: UI install
        run: npm ci --ignore-scripts
        working-directory: ui

      - name: UI build
        run: npm run build
        working-directory: ui

      - name: UI library tests
        run: npm run test:lib
        working-directory: ui

      - name: Install cargo-audit
        # Preinstalled on the ubuntu-22.04 runner image but absent from the
        # leaner ubuntu-24.04 image; the dependency audit shells out to it.
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-audit

      - name: Public release-check tests
        run: >
          node --test
          scripts/public-tests/cross-host-media.test.mjs
          scripts/public-tests/dependency-audit.test.mjs
          scripts/public-tests/feature-contract.test.mjs
          scripts/public-tests/ignored-test-rigs.test.mjs
          scripts/public-tests/receipt-summary.test.mjs
          scripts/public-tests/safe-data.test.mjs
          scripts/public-tests/update-check-disclosure-contract.test.mjs
          scripts/public-tests/updater-manifest.test.mjs

      - name: Dependency audit
        run: node scripts/release/dependency-audit.mjs

      - name: Verb-argument sync check
        run: bash scripts/verbargs-sync.sh

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ./app -> target

      - name: Install Linux build deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            build-essential pkg-config clang libclang-dev \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev \
            libx11-dev libxi-dev libxtst-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            ffmpeg espeak-ng

      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: app

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: app

      - name: cargo test --workspace
        run: cargo test --workspace
        working-directory: app
