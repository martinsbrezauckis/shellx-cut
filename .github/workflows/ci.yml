# ShellX Cut CI
#
# Runs on every push and pull request. A fresh runner type-checks, lints, tests,
# and audits only the files in this repository. Cross-platform packaging is
# exercised separately by release.yml.
#
# The Rust suite runs on all three shipped platforms. ShellX Cut ships Windows,
# macOS and Linux installers, and a single-platform run cannot stand in for the
# other two: `#[cfg(windows)]` and `#[cfg(target_os = "macos")]` bodies are not
# compiled at all on a Linux runner, and behaviour that depends on OS path,
# environment or locale semantics is invisible there by construction.
#
# `fail-fast: false` keeps every platform reporting when one breaks — whether a
# failure is universal or platform-specific is the first thing worth knowing.
# Each job also marks independent checks `continue-on-error` and ends with one
# collected verdict. Test runners use their own no-bail mode, so one failure
# does not hide later failures on the same platform.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-and-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22

      - name: Install Rust stable for exact public MCP coverage
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Install Linux build deps for exact cutd
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            build-essential pkg-config clang libclang-dev \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev \
            libx11-dev libxi-dev libxtst-dev

      - name: UI install
        id: ui_install
        continue-on-error: true
        run: npm ci --ignore-scripts
        working-directory: ui

      - name: UI build
        id: ui_build
        continue-on-error: true
        run: npm run build
        working-directory: ui

      - name: Install Playwright Chromium
        id: playwright_install
        continue-on-error: true
        # package-command-contract runs the real layout verifier. A fresh
        # runner has the Playwright package after npm ci, but no browser binary.
        run: npx playwright install --with-deps chromium
        working-directory: ui

      - name: UI library tests
        id: ui_library_tests
        continue-on-error: true
        run: npm run test:lib -- --no-bail
        working-directory: ui

      - name: Install cargo-audit
        id: cargo_audit_install
        continue-on-error: true
        # Preinstalled on the ubuntu-22.04 runner image but absent from the
        # leaner ubuntu-24.04 image; the dependency audit shells out to it.
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: cargo-audit

      - name: Build exact cutd for public MCP coverage
        id: exact_cutd_build
        continue-on-error: true
        run: cargo build --manifest-path app/Cargo.toml -p server --bin cutd

      - name: Public release-check inventory and tests
        id: public_release_tests
        continue-on-error: true
        env:
          # Agent Chat containment must exercise this checkout's binary, never
          # cold-compile inside its bounded MCP exchange timer.
          CUTD_BIN: ${{ github.workspace }}/app/target/debug/cutd
        run: node scripts/check-public-test-inventory.mjs --ci --run --no-bail

      - name: Dependency audit
        id: dependency_audit
        continue-on-error: true
        run: node scripts/release/dependency-audit.mjs

      - name: Generated verb aggregate is current
        id: generated_verbs
        continue-on-error: true
        run: node scripts/generate-verbs.mjs --check

      - name: Generated verb behavior is current
        id: generated_verb_contract
        continue-on-error: true
        run: node scripts/generate-verb-contract.mjs --check

      - name: Verb-argument sync check
        id: verb_argument_sync
        continue-on-error: true
        run: bash scripts/verbargs-sync.sh

      - name: Fail after all Node/UI checks are collected
        if: always()
        env:
          SHELLX_CI_COLLECTED_RESULTS: >-
            {"schema":"shellx-cut/github-collected-checks@1","checks":[
              {"name":"UI install","outcome":"${{ steps.ui_install.outcome }}"},
              {"name":"UI build","outcome":"${{ steps.ui_build.outcome }}"},
              {"name":"Playwright install","outcome":"${{ steps.playwright_install.outcome }}"},
              {"name":"UI library tests","outcome":"${{ steps.ui_library_tests.outcome }}"},
              {"name":"cargo-audit install","outcome":"${{ steps.cargo_audit_install.outcome }}"},
              {"name":"exact cutd build","outcome":"${{ steps.exact_cutd_build.outcome }}"},
              {"name":"public release tests","outcome":"${{ steps.public_release_tests.outcome }}"},
              {"name":"dependency audit","outcome":"${{ steps.dependency_audit.outcome }}"},
              {"name":"generated verbs","outcome":"${{ steps.generated_verbs.outcome }}"},
              {"name":"generated verb contract","outcome":"${{ steps.generated_verb_contract.outcome }}"},
              {"name":"verb argument sync","outcome":"${{ steps.verb_argument_sync.outcome }}"}
            ]}
        run: node scripts/release/collect-github-check-results.mjs

  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      # One platform failing must not cancel the others — see the header.
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: ./app -> target
          # Keyed per platform so three targets never share one cache entry.
          key: ${{ matrix.platform }}

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-24.04'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            build-essential pkg-config clang libclang-dev \
            libasound2-dev libpipewire-0.3-dev libdbus-1-dev \
            libx11-dev libxi-dev libxtst-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            ffmpeg espeak-ng

      # macOS and Windows need no system libraries for the capture backends —
      # `capture-macos` (avfoundation/ScreenCaptureKit) and `capture-windows`
      # (WGC/Media Foundation) bind OS frameworks that are already present, and
      # Cargo selects them automatically from the `[target.'cfg(target_os …)']`
      # blocks in app/server/Cargo.toml. Only ffmpeg is missing: the media
      # crate shells out to it, and neither runner image ships it.
      - name: Install macOS test deps
        if: matrix.platform == 'macos-latest'
        run: |
          # Homebrew's STANDARD ffmpeg formula omits vidstab (and other optional
          # filters), so it cannot run the stabilise/subtitle/colour paths.
          # ffmpeg-full carries them, lives in homebrew/core (no tap required)
          # and ships a bottle, so this is a fast binary install rather than a
          # source build. It provides ass, vidstabdetect, and zscale.
          brew install ffmpeg-full espeak-ng
          # The runner image also ships its own ffmpeg, so make sure Homebrew's
          # wins PATH for the steps below.
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Install Windows test deps
        if: matrix.platform == 'windows-latest'
        run: choco install ffmpeg --no-progress -y

      # Cut's render path uses ass (subtitles), vidstab (stabilisation) and zscale
      # (colour). An ffmpeg built without them does not fail honestly: tests die
      # with a bare "No such filter: 'ass'" that reads like a product defect, which
      # is exactly how the first macOS CI run presented. Check the capability here
      # and name what is missing, so the environment is blamed where it is at fault.
      - name: Verify ffmpeg carries the filters the render path needs
        id: ffmpeg_filters
        continue-on-error: true
        shell: bash
        run: |
          echo "ffmpeg on PATH: $(command -v ffmpeg)"
          ffmpeg -hide_banner -version | head -1
          missing=""
          for f in ass vidstabdetect zscale; do
            ffmpeg -hide_banner -filters 2>/dev/null | grep -qw "$f" || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::ffmpeg is missing required filter(s):$missing" >&2
            exit 1
          fi
          echo "all required filters present"

      # Formatting is byte-identical everywhere, so checking it three times
      # would only spend wall-clock. Clippy is NOT redundant across platforms:
      # it type-checks the cfg-gated bodies that this runner alone compiles.
      - name: cargo fmt --check
        id: rustfmt
        continue-on-error: true
        if: matrix.platform == 'ubuntu-24.04'
        run: cargo fmt --check
        working-directory: app

      - name: cargo clippy -D warnings
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: app

      # The Tauri shell is intentionally outside app/Cargo.toml's workspace.
      # Compile it explicitly on every shipped OS so cfg-gated updater,
      # recorder, and native-window code cannot bypass ordinary CI. `externalBin`
      # is a generated release payload, so a fresh source checkout omits it;
      # the separate smoke-build workflow rebuilds and stages that exact payload.
      - name: Prepare clean-source Tauri resources
        id: tauri_resources
        continue-on-error: true
        shell: bash
        run: mkdir -p ui/dist

      - name: Desktop shell cargo check
        id: desktop_check
        continue-on-error: true
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo check --lib
        working-directory: app/desktop/src-tauri

      - name: cargo test --workspace
        id: cargo_test
        continue-on-error: true
        run: cargo test --workspace --no-fail-fast
        working-directory: app

      - name: Fail after all Rust checks are collected
        if: always()
        env:
          SHELLX_CI_COLLECTED_RESULTS: >-
            {"schema":"shellx-cut/github-collected-checks@1","checks":[
              {"name":"ffmpeg filter contract","outcome":"${{ steps.ffmpeg_filters.outcome }}"},
              {"name":"rustfmt","outcome":"${{ steps.rustfmt.outcome }}","allowSkipped":true},
              {"name":"clippy","outcome":"${{ steps.clippy.outcome }}"},
              {"name":"Tauri clean-source resources","outcome":"${{ steps.tauri_resources.outcome }}"},
              {"name":"desktop shell cargo check","outcome":"${{ steps.desktop_check.outcome }}"},
              {"name":"cargo test workspace","outcome":"${{ steps.cargo_test.outcome }}"}
            ]}
        run: node scripts/release/collect-github-check-results.mjs
