[package]
name = "record-recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ShellX Record — durable checkpoint manifests and fail-closed crash recovery."

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
cut-media = { path = "../../media" }
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
